---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: node
polling_url: "https://api.goswift.ly/real-time/{{ agency }}/gtfs-rt-trip-updates?format=json"
polling_headers: Authorization={{ swiftly_api_key }}
polling_body: ''
id: 310138
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  description: 'Shows live arrival times for any Swiftly-powered transit agency and route. Provide your own Swiftly API key below — no backend to deploy. See the GitHub repo for setup instructions.'
  category: travel,life
  email_address: nickzelei+trmnl@gmail.com
  github_url: https://github.com/nickzelei/swiftly-route-trmnl
- keyname: swiftly_api_key
  field_type: password
  name: Swiftly API Key
  description: Your Swiftly API key (account-scoped to the agencies you're authorized for). Request one at https://www.goswift.ly/api-license.
  group: Route
- keyname: agency
  field_type: string
  placeholder: sfbay-ferry
  name: Agency
  description: The agency key provided to you by Swiftly
  group: Route
- keyname: route
  field_type: number
  placeholder: 19417
  name: Route
  description: The numeric route id you wish to poll. Not sure what it is? Run scripts/explore-routes.mjs from the GitHub repo (linked above) with your Swiftly API key and agency to list every route id for your agency.
  group: Route
name: Swiftly
refresh_interval: 15
