# trmnlp dev-server config — not uploaded to TRMNL.
# {{ env.VARIABLE }} interpolation is available in this file only.
---
# Live-reload when these change.
watch:
  - .trmnlp.yml
  - src

# Dev values for the plugin's custom fields (defined in src/settings.yml).
# swiftly_api_key comes from the environment so no secret is checked into the
# repo. trmnlp has no .env support of its own; mise loads a gitignored root
# .env into the environment instead (see .env.example).
#
# Heads up: this `{{ env.X }}` templating is resolved by trmnlp for
# polling_url/polling_headers, while the raw string reaches
# src/transform.js's custom_fields_values locally. That is harmless because
# the transform no longer performs requests with the key; all three Swiftly
# calls happen in polling. Real installs receive the literal value entered by
# the installer.
custom_fields:
  agency: sfbay-ferry
  route: 19417
  swiftly_api_key: "{{ env.SWIFTLY_API_KEY }}"

# Static preview payload, so previews render offline with no Swiftly API key.
# The top-level keys become Liquid variables directly (TRMNL's Polling
# strategy; see README.md).
#
# To preview against LIVE data instead: comment out this `variables:` block
# and make sure SWIFTLY_API_KEY is set in a repo-root .env (see .env.example)
# — the newline-separated polling_url hits all three Swiftly endpoints
# directly, and src/transform.js (built from src/transform.ts via `npm run
# build:transform` — note trmnlp's live-reload watches src/, so saving
# transform.ts triggers a reload, but it'll still use the last-built
# transform.js until you rerun the build) reshapes the indexed responses.
variables:
  agency: sfbay-ferry
  route_id: "19417"
  route_name: Alameda Seaplane
  updated_at: 3:23 PM
  sections:
    - title: To Alameda Seaplane Lagoon
      direction_id: "0"
      trips:
        - vehicle: Delphinus
          stops:
            - name: San Francisco Ferry Building Gate F
              time: 3:35 PM
              mins: 12
            - name: Alameda Seaplane Lagoon Ferry Terminal
              time: 3:47 PM
              mins: 24
        - vehicle: Carina
          stops:
            - name: San Francisco Ferry Building Gate E
              time: 4:05 PM
              mins: 42
            - name: Alameda Seaplane Lagoon Ferry Terminal
              time: 4:17 PM
              mins: 54
    - title: To San Francisco Ferry Building Gate F
      direction_id: "1"
      trips:
        - vehicle: Carina
          stops:
            - name: Alameda Seaplane Lagoon Ferry Terminal
              time: 3:35 PM
              mins: 11
            - name: San Francisco Ferry Building Gate E
              time: 3:51 PM
              mins: 28
        # A three-stop trip, to exercise longer chains in the templates.
        - vehicle: Cetus
          stops:
            - name: Alameda Main Street Terminal
              time: 4:00 PM
              mins: 37
            - name: Oakland Jack London Square
              time: 4:12 PM
              mins: 49
            - name: San Francisco Ferry Building Gate F
              time: 4:25 PM
              mins: 62

  # The trmnl.* namespace (device + user context).
  trmnl: {}
