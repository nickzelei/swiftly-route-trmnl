name: TRMNL

on:
  pull_request:
    paths:
      - 'src/**'
      - 'transform-src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.trmnlp.yml'
      - 'mise.toml'
      - '.github/workflows/trmnl.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'transform-src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.trmnlp.yml'
      - 'mise.toml'
      - '.github/workflows/trmnl.yml'

jobs:
  # Compile transform-src/transform.ts to src/transform.js (the serverless
  # transform trmnlp/TRMNL actually execute — see README.md), then render
  # the templates to static HTML and lint the plugin.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the tools pinned in mise.toml (incl. Node and the
      # trmnl_preview gem) and caches them, so repeat installs are fast.
      - uses: jdx/mise-action@v4
      - run: npm ci
      - run: npm run build:transform
      - run: trmnlp lint
      - run: trmnlp build

  # Deploy the templates + settings.yml to TRMNL on merge to main.
  # Requires the TRMNL_API_KEY repo secret and an `id:` in src/settings.yml.
  # push:
  #   needs: build
  #   if: github.ref == 'refs/heads/main'
