  #     - uses: jdx/mise-action@v4
  #     - run: npm ci
  #     - run: npm run build:transform
  #     - run: trmnlp push --force
  #       env:
  #         TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
