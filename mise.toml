[tools]
node = "lts"
uv = "latest"
ruby = "3.4"

# trmnlp (the TRMNL plugin dev server) ships as the trmnl_preview gem. mise's
# `gem:` backend mis-resolves its dependency tree, so install it via a hook
# instead — `--conservative` makes this a fast no-op once it's present, so a
# single `mise install` still bootstraps the whole repo.
[hooks]
postinstall = "gem install --conservative trmnl_preview"

# Hooks are gated behind mise's experimental flag; enable it project-locally
# so contributors don't have to flip a global setting.
[settings]
experimental = true

# Load PROXY_URL / PROXY_SECRET from a gitignored root .env so trmnlp can
# preview against live data (it has no .env support of its own). Optional —
# previews use the static payload in trmnl/.trmnlp.yml when these are unset.
# See .env.example.
[env]
_.file = ".env"
