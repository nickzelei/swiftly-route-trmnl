---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: ''
polling_url: "{{ api_url }}?agency={{ agency }}&route={{ route }}"
polling_headers: Authorization=Bearer {{ api_key }}
polling_body: ''
id: 310138
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  description: 'Shows live arrival times for any Swiftly-powered transit agency and route. This plugin is self-hosted: you must deploy your own backend (Github provides Cloudflare Worker example) and provide your own Swiftly API key before it can pull data. See the GitHub repo for setup instructions.'
  category: travel,life
  email_address: nickzelei+trmnl@gmail.com
  github_url: https://github.com/nickzelei/swiftly-route-trmnl
- keyname: api_url
  field_type: string
  name: Backend API Url
  description: The base URL of your deployed backend (e.g. your Cloudflare Worker) that this plugin polls.
  placeholder: https://example.com
  group: Backend Connection
- keyname: api_key
  field_type: password
  name: Backend API Key
  description: The key used to authenticate with your deployed backend (not the API key provided by Swiftly!)
  group: Backend Connection
- keyname: agency
  field_type: string
  placeholder: sfbay-ferry
  name: Agency
  description: The agency key provided to you by Swiftly
  group: Route
- keyname: route
  field_type: number
  placeholder: 19417
  name: Route
  description: The numeric route id you wish to poll. Not sure what it is? Run explore/explore_routes.py from the GitHub repo (linked above) with your Swiftly API key and agency to list every route id for your agency.
  group: Route
name: Swiftly
refresh_interval: 15
