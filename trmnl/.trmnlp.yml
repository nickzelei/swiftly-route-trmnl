# trmnlp dev-server config — not uploaded to TRMNL.
# {{ env.VARIABLE }} interpolation is available in this file only.
---
# Live-reload when these change.
watch:
  - .trmnlp.yml
  - src

# Dev values for the plugin's custom fields (defined in src/settings.yml).
# api_url / api_key come from the environment so no personal URL or secret is
# checked into the repo. trmnlp has no .env support of its own; mise loads a
# gitignored root .env into the environment instead (see .env.example).
custom_fields:
  api_url: "{{ env.PROXY_URL }}"
  agency: sfbay-ferry
  route: 19417
  api_key: "{{ env.PROXY_SECRET }}"

# Static preview payload — mirrors the JSON the Cloudflare Worker returns, so
# previews render offline with no Swiftly API key. The top-level keys become
# Liquid variables directly (TRMNL's Polling strategy; see README.md).
#
# To preview against LIVE data instead: comment out this `variables:` block.
# polling_url is `{{ api_url }}?agency=...&route=...`, so point the `api_url`
# custom field above at either (a) your deployed Worker via the PROXY_URL env
# var, or (b) a local Worker (`cd worker && npm run dev`) by setting PROXY_URL
# to `http://localhost:8787`.
variables:
  agency: sfbay-ferry
  route_id: "19417"
  route_name: Alameda Seaplane
  updated_at: 3:23 PM
  sections:
    - title: To Alameda Seaplane Lagoon
      direction_id: "0"
      trips:
        - vehicle: Delphinus
          stops:
            - name: San Francisco Ferry Building Gate F
              time: 3:35 PM
              mins: 12
            - name: Alameda Seaplane Lagoon Ferry Terminal
              time: 3:47 PM
              mins: 24
        - vehicle: Carina
          stops:
            - name: San Francisco Ferry Building Gate E
              time: 4:05 PM
              mins: 42
            - name: Alameda Seaplane Lagoon Ferry Terminal
              time: 4:17 PM
              mins: 54
    - title: To San Francisco Ferry Building Gate F
      direction_id: "1"
      trips:
        - vehicle: Carina
          stops:
            - name: Alameda Seaplane Lagoon Ferry Terminal
              time: 3:35 PM
              mins: 11
            - name: San Francisco Ferry Building Gate E
              time: 3:51 PM
              mins: 28
        # A three-stop trip, to exercise longer chains in the templates.
        - vehicle: Cetus
          stops:
            - name: Alameda Main Street Terminal
              time: 4:00 PM
              mins: 37
            - name: Oakland Jack London Square
              time: 4:12 PM
              mins: 49
            - name: San Francisco Ferry Building Gate F
              time: 4:25 PM
              mins: 62

  # The trmnl.* namespace (device + user context).
  trmnl: {}
