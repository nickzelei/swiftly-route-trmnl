<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#1E8FA6"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- water ripples -->
  <path d="M0,360 Q64,340 128,360 T256,360 T384,360 T512,360 L512,512 L0,512 Z" fill="#ffffff" opacity="0.10"/>
  <path d="M0,395 Q64,375 128,395 T256,395 T384,395 T512,395 L512,512 L0,512 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M0,422 Q64,402 128,422 T256,422 T384,422 T512,422 L512,512 L0,512 Z" fill="#ffffff" opacity="0.24"/>

  <!-- ferry hull (double-ended, like SF Bay Ferry's actual vessels) -->
  <path d="M90,360
           Q90,328 132,323
           L380,323
           Q422,328 422,360
           Q422,398 256,406
           Q90,398 90,360
           Z" fill="#ffffff"/>

  <!-- cabin superstructure -->
  <path d="M170,323
           L170,272
           Q170,257 185,257
           L327,257
           Q342,257 342,272
           L342,323
           Z" fill="#ffffff"/>

  <!-- window band -->
  <rect x="182" y="284" width="148" height="14" rx="7" fill="#F4A261" opacity="0.9"/>

  <!-- pilothouse -->
  <rect x="223" y="212" width="66" height="46" rx="8" fill="#ffffff"/>

  <!-- mast -->
  <line x1="256" y1="212" x2="256" y2="176" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="169" r="8" fill="#F4A261"/>

  <!-- clock badge: arrival times -->
  <circle cx="398" cy="378" r="48" fill="#F4A261" stroke="#ffffff" stroke-width="5"/>
  <line x1="398" y1="378" x2="398" y2="350" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="398" y1="378" x2="422" y2="378" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="398" cy="378" r="4" fill="#ffffff"/>
</svg>
