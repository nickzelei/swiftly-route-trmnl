          $ref: '#/responses/400%20-%20Swiftly'
        '401':
          $ref: '#/responses/401%20-%20Swiftly'
        '403':
          $ref: '#/responses/403%20-%20Swiftly'
        '429':
          $ref: '#/responses/429%20-%20Swiftly'
        '503':
          $ref: '#/responses/503%20-%20Swiftly'
      summary: Agency info
      security:
        - Authorization: []
      parameters:
        - $ref: '#/parameters/agencyKey'
      description: 'Fetches information about an agency including agency name, timezone and url. Swiftly''s agency info originates from an agency''s raw data as specified in their GTFS files. Where appropriate, Swiftly adds normalization and supplementary information.'
