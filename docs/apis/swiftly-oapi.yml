            type: object
            properties: {}
      description: "In the body of this POST request, include a JSON-formatted string describing a list of objects. Each object must contain a `vehicleId` representing the vehicle to be assigned, and a `blockId` representing the block to assign it to. Optionally, the object may also include a `driverId` to indicate who is driving the vehicle.\n\nThe API will return a JSON-formatted output with a list of objects describing the result of each assignment attempt. Each object will include `vehicleId`, `blockId`, `driverId` (if included in the original request), `success` (a boolean indicating whether the assignment was successful), and `reason` (a string describing the reason for the success or failure of the assignment).\n\nExample input:\n```\n[\n\t{\n\t\tvehicleId: \"1234\",\n\t\tblockId: \"5678\",\n\t\tdriverId: \"9999\"\n\t},\n\t{\n\t\tvehicleId: \"2222\",\n\t\tblockId: \"3333\",\n\t\tdriverId: \"4444\"\n\t}\n]\n```\n\nExample output:\n```\n{\n  \"results\": [\n    {\n      \"vehicleId\": \"2048\",\n      \"success\": false,\n      \"reason\": \"blockId is NULL\"\n    },\n    {\n      \"vehicleId\": \"2048\",\n      \"blockId\": \"9302\",\n      \"success\": true,\n      \"reason\": \"Vehicle was already on that assignment\"\n    }\n  ]\n}\n```"
      summary: Assign vehicles
      tags:
        - Operations
    parameters:
      - name: agencyKey
        in: path
        type: string
        required: true
securityDefinitions:
  Authorization:
    type: apiKey
    name: Authorization
    in: header
schemes:
  - https
security:
  - Authorization: []
parameters:
  agencyKey:
    in: path
    type: string
    required: true
    description: |
      The agency key used in the Swiftly dashboard. This is the parameter that follows "dashboard.goswift.ly/" in the Swiftly dashboard url.
    minLength: 1
    maxLength: 64
    name: agencyKey
  route:
    name: route
    in: query
    type: string
    description: |-
      The route to return results for (as a string). If not included, includes data for all routes. Can also be comma separated list of route keys. For example `route=1,2,5`

      Note that this query parameter refers to the `route_short_name` from GTFS. Route short name is the primary route identifier in the Swiftly system. When an API call includes `route` as a path or query parameter, the route short name should be used.
tags:
  - name: Agency Info
  - name: Real-time
  - name: Operations
produces:
  - application/json
  - application/json; charset=utf-8
host: api.goswift.ly
definitions:
  Common_Oas2_Error Swiftly:
    type: object
    title: Error Swiftly
    required:
      - errorMessage
      - errorCode
    properties:
      errorMessage:
        type: string
      errorCode:
        type: integer
  Common_Oas2_GTFS-rt-TripProperties:
    type: object
    description: |-
      Defines updated properties of the trip. Only provided when v3 is requested and `schedule_relationship=DUPLICATED`

      **Caution:** this message is still **experimental**, and subject to change. It may be formally adopted in the future.
    properties:
      trip_id:
        type: string
        description: |-
          Defines the identifier of a new trip that is a duplicate of an existing trip defined in (CSV) GTFS trips.txt but will start at a different service date and/or time (defined using `TripProperties.start_date` and `TripProperties.start_time`). See definition of `trips.trip_id` in (CSV) GTFS. Its value must be different than the ones used in the (CSV) GTFS. This field is required if schedule_relationship is `DUPLICATED`, otherwise this field must not be populated and will be ignored by consumers.

          **Caution:** this field is still **experimental**, and subject to change. It may be formally adopted in the future.
      start_date:
        type: string
        description: |-
          Service date on which the duplicated trip will be run. Must be provided in YYYYMMDD format. This field is required if `schedule_relationship` is `DUPLICATED`, otherwise this field must not be populated and will be ignored by consumers.

          **Caution:** this field is still **experimental**, and subject to change. It may be formally adopted in the future.
      start_time:
        type: string
        description: |-
          Defines the departure start time of the trip when it’s duplicated. See definition of `stop_times.departure_time` in (CSV) GTFS. Scheduled arrival and departure times for the duplicated trip are calculated based on the offset between the original trip `departure_time` and this field. For example, if a GTFS trip has stop A with a `departure_time` of 10:00:00 and stop B with `departure_time` of 10:01:00, and this field is populated with the value of 10:30:00, stop B on the duplicated trip will have a scheduled departure_time of 10:31:00. Real-time prediction delay values are applied to this calculated schedule time to determine the predicted time. For example, if a departure delay of 30 is provided for stop B, then the predicted departure time is 10:31:30. Real-time prediction time values do not have any offset applied to them and indicate the predicted time as provided. For example, if a departure time representing 10:31:30 is provided for stop B, then the predicted departure time is 10:31:30.This field is required if schedule_relationship is `DUPLICATED`, otherwise this field must not be populated and will be ignored by consumers.

          **Caution:** this field is still **experimental**, and subject to change. It may be formally adopted in the future.
  Common_Oas2_GTFS-rt-VehiclePosition:
    type: object
    title: GTFS-rt-VehiclePosition
    required:
      - trip
      - vehicle
      - position
      - current_stop_sequence
      - stop_id
      - current_status
      - timestamp
    properties:
      trip:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-tripDescriptor'
      vehicle:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-vehicleDescriptor'
      position:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-positions'
      current_stop_sequence:
        type: integer
        description: The stop sequence index of the current stop.  This matches the `stop_sequence` for this stop from the stop_times.txt GTFS file. The meaning of current stop is determined by the `current_status` field.
      stop_id:
        type: string
        description: Identifies the current stop. The value matches the `stop_id` from the stops.txt GTFS file.
      current_status:
        type: string
        description: |-
          The current vehicle status can be one of the following:
          | Value         | Meaning  |
          |---------------|----------|
          | INCOMING_AT   | The vehicle is just about to arrive at the stop. |
          | STOPPED_AT    | The vehicle is standing at the stop. |
          | IN_TRANSIT_TO | The vehicle has departed the previous stop and is in transit. |
      timestamp:
        type: string
        description: 'Moment at which the vehicle''s position was measured in epoch time (i.e., number of seconds since January 1st 1970 00:00:00 UTC)'
  Common_Oas2_GTFS-rt-VehiclePositionsFeed:
    type: object
    title: GTFS-rt-VehiclePositionsFeed
    required:
      - header
      - entities
    properties:
      header:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-feedHeader'
      entities:
        type: object
        required:
          - id
          - vehicle
        properties:
          id:
            type: string
            description: Feed-unique identifier for this entity.
          vehicle:
            $ref: '#/definitions/Common_Oas2_GTFS-rt-VehiclePosition'
  Common_Oas2_GTFS-rt-alert:
    type: object
    title: GTFS-rt-alert
    properties:
      active_period:
        type: array
        items:
          $ref: '#/definitions/Common_Oas2_GTFS-rt-timeRange'
      informed_entity:
        type: array
        items:
          $ref: '#/definitions/Common_Oas2_GTFS-rt-entitySelector'
      cause:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-cause'
      effect:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-effect'
      header_text:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-headerText'
      description_text:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-descriptionText'
      url:
        type: string
        description: The URL which provides additional information about the alert.
    required:
      - active_period
      - informed_entity
      - cause
      - effect
      - header_text
      - description_text
    description: 'An alert, indicating some sort of incident in the public transit network.'
  Common_Oas2_GTFS-rt-alertsFeed:
    type: object
    title: GTFS-rt-alertsFeed
    properties:
      header:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-feedHeader'
      entities:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: Feed-unique identifier for this entity.
            alert:
              $ref: '#/definitions/Common_Oas2_GTFS-rt-alert'
  Common_Oas2_GTFS-rt-cause:
    title: GTFS-rt-cause
    description: Cause of an alert.
    type: string
    enum:
      - UNKNOWN_CAUSE
      - OTHER_CAUSE
      - TECHNICAL_PROBLEM
      - STRIKE
      - DEMONSTRATION
      - ACCIDENT
      - HOLIDAY
      - WEATHER
      - MAINTENANCE
      - CONSTRUCTION
      - POLICE_ACITIVY
      - MEDICAL_EMERGENCY
  Common_Oas2_GTFS-rt-descriptionText:
    title: GTFS-rt-DescriptionText
    description: Description for the alert. This plain-text string will be formatted as the body of the alert (or shown on an explicit "expand" request by the user). The information in the description should add to the information of the header.
    type: array
    items:
      $ref: '#/definitions/Common_Oas2_GTFS-rt-translation'
  Common_Oas2_GTFS-rt-effect:
    type: string
    description: The effect of this problem on the affected entity.
    title: GTFS-rt-effect
    enum:
      - NO_SERVICE
      - REDUCED_SERVICE
      - SIGNIFICANT_DELAYS
      - DETOUR
      - ADDITIONAL_SERVICE
      - MODIFIED_SERVICE
      - OTHER_EFFECT
      - UNKNOWN_EFFECT
      - STOP_MOVED
  Common_Oas2_GTFS-rt-entitySelector:
    type: object
    description: 'A selector for an entity in a GTFS feed. The values of the fields should correspond to the appropriate fields in the GTFS feed. At least one specifier must be given - all fields in an EntitySelector cannot be empty. If several are given, then the matching has to apply to all the given specifiers.'
    title: GTFS-rt-entitySelector
    properties:
      agency_id:
        type: string
      route_id:
        type: string
      stop_id:
        type: string
  Common_Oas2_GTFS-rt-feedHeader:
    type: object
    required:
      - gtfs_realtime_version
      - incrementality
      - timestamp
    properties:
      gtfs_realtime_version:
        type: string
        description: Version of the feed specification. The current version is 2.0.
      incrementality:
        type: string
        description: The value should always be "FULL_DATASET" meaning this feed update will overwrite all preceding realtime information for the feed. Thus this update is expected to provide a full snapshot of all known realtime information.
      timestamp:
        type: integer
        description: 'The timestamp identifies the moment when the content of this feed has been created. Time is in epoch time  (i.e., number of seconds since January 1st 1970 00:00:00 UTC)'
  Common_Oas2_GTFS-rt-headerText:
    title: GTFS-rt-headerText
    description: 'Header for the alert. This plain-text string will be highlighted, for example in boldface.'
    type: array
    items:
      $ref: '#/definitions/Common_Oas2_GTFS-rt-translation'
  Common_Oas2_GTFS-rt-positions:
    type: object
    title: GTFS-rt-positions
    description: Current position of the vehicle
    required:
      - latitude
      - longitude
    properties:
      latitude:
        type: number
        description: Vehicle position - degrees latitude.
      longitude:
        type: number
        description: Vehicle position - degrees longitude.
      bearing:
        type: integer
        description: 'Vehicle bearing, in degrees, clockwise from True North, i.e., 0 is North and 90 is East.'
      speed:
        type: integer
        description: Vehicle speed measured in meters per second.
  Common_Oas2_GTFS-rt-stopTimeUpdate:
    type: object
    title: GTFS-rt-stopTimeUpdate
    description: 'Updates to StopTimes for the trip (both future, i.e., predictions, and in some cases, past ones, i.e., those that already happened). '
    properties:
      stop_sequence:
        type: integer
        description: The GTFS-stop sequence. Matches the stop_sequence for this trip and stop from the _stop_times.txt_ GTFS file.
      departure:
        type: object
        title: GTFS-rt-stopTimeEvent
        properties:
          time:
            type: integer
            description: 'Predicted event time as an epoch timestamp (i.e., number of seconds since January 1st 1970 00:00:00 UTC).'
          uncertainty:
            type: integer
            description: |-
              The GTFS-realtime specification allows for the use of an uncertainty field, but does not clearly specify how to use. Swiftly has defined a few uncertainty codes as follows:
              | Value           | Meaning    |
              |-----------------|------------------------------------------------------------------------------------------------------------------------------------------------------|
              | <300 or omitted | Valid real-time prediction   |
              | 300             | Real-time prediction not available. This code is primarily used when a vehicle has not yet been assigned to the trip, (i.e. because the block has not started yet). It is a schedule-based prediction, but Swiftly adjusts the schedule-based prediction time using observed historical travel times to make predictions more accurate than the schedule. |
              | 301             | Valid real-time prediction, though the bus appears to be stalled or significantly delayed and predictions are not as accurate     |
              | > 301           | Likely invalid prediction, recommend not showing anything (and not showing scheduled time), very rare situation.                                    |
      stop_id:
        type: string
        description: The GTFS-stop sequence. Matches the stop_id from the _stops.txt_ GTFS file.
      schedule_relationship:
        type: string
        description: |-
          The relation between this StopTime and the static schedule.

          | Value       | Meaning |
          |-------------|---------------|
          | **SCHEDULED** | The vehicle is proceeding in accordance with its static schedule of stops, although not necessarily according to the times of the schedule. |
          | **SKIPPED** | The stop is skipped, i.e., the vehicle will not stop at this stop, such as due to a stop closure or detour.   |
      arrival:
        type: object
        title: GTFS-rt-stopTimeEvent
        properties:
          time:
            type: integer
            description: 'Predicted event time as an epoch timestamp (i.e., number of seconds since January 1st 1970 00:00:00 UTC).'
          uncertainty:
            type: integer
            description: |-
              The GTFS-realtime specification allows for the use of an uncertainty field, but does not clearly specify how to use. Swiftly has defined a few uncertainty codes as follows:
              | Value           | Meaning    |
              |-----------------|------------------------------------------------------------------------------------------------------------------------------------------------------|
              | <300 or omitted | Valid real-time prediction   |
              | 300             | Real-time prediction not available. This code is primarily used when a vehicle has not yet been assigned to the trip, (i.e. because the block has not started yet). It is a schedule-based prediction, but Swiftly adjusts the schedule-based prediction time using observed historical travel times to make predictions more accurate than the schedule. |
              | 301             | Valid real-time prediction, though the bus appears to be stalled or significantly delayed and predictions are not as accurate     |
              | > 301           | Likely invalid prediction, recommend not showing anything (and not showing scheduled time), very rare situation.                                    |
    required:
      - stop_sequence
      - stop_id
      - schedule_relationship
  Common_Oas2_GTFS-rt-timeRange:
    type: object
    title: GTFS-rt-timeRange
    description: A time interval. The interval is considered active at time t if t is greater than or equal to the start time and less than the end time.
    properties:
      start:
        type: integer
        description: 'Start time, in POSIX time (i.e., number of seconds since January 1st 1970 00:00:00 UTC). If missing, the interval starts at minus infinity. If a TimeRange is provided, either start or end must be provided - both fields cannot be empty.'
      end:
        description: 'End time, in POSIX time (i.e., number of seconds since January 1st 1970 00:00:00 UTC). If missing, the interval ends at plus infinity. If a TimeRange is provided, either start or end must be provided - both fields cannot be empty.'
        type: integer
  Common_Oas2_GTFS-rt-translation:
    title: GTFS-rt-translation
    type: object
    properties:
      translation:
        type: array
        description: 'An internationalized message containing per-language versions of a snippet of text or a URL. One of the strings from a message will be picked up. The resolution proceeds as follows: If the UI language matches the language code of a translation, the first matching translation is picked. If a default UI language (e.g., English) matches the language code of a translation, the first matching translation is picked. If some translation has an unspecified language code, that translation is picked.'
        items:
          type: object
          properties:
            text:
              type: string
              description: A UTF-8 string containing the message.
            language:
              type: string
              description: 'BCP-47 language code. Can be omitted if the language is unknown or if no internationalization is done at all for the feed. At most one translation is allowed to have an unspecified language tag - if there is more than one translation, the language must be provided.'
          required:
            - text
    required:
      - translation
  Common_Oas2_GTFS-rt-tripDescriptor:
    type: object
    title: GTFS-rt-tripDescriptor
    properties:
      trip_id:
        type: string
        description: The `trip_id` from the GTFS feed that this selector refers to.
      route_id:
        type: string
        description: 'The `route_id` from the GTFS that this selector refers to. '
      start_date:
        type: string
        description: The start date of this trip instance in `YYYYMMDD` format.
      schedule_relationship:
        type: string
        description: |-
          The relation between this trip and the static schedule.


          | Value       | Meaning |
          |-------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
          | SCHEDULED   | Trip that is running in accordance with its GTFS schedule, or is close enough to the scheduled trip to be associated with it |
          | ADDED       | An extra trip that was added in addition to a running schedule, for example, to replace a broken vehicle or to respond to sudden passenger load. When version 3 is requested, then `DUPLICATED` will be used instead (see below). |
          | UNSCHEDULED | A trip that is running with no schedule associated to it - this value is used to identify trips defined in GTFS frequencies.txt with exact_times = 0. It should not be used to describe trips not defined in GTFS frequencies.txt, or trips in GTFS frequencies.txt with exact_times = 1. |
          | CANCELED    | A trip that existed in the schedule but was removed. |
          | DUPLICATED | A new trip that is the same as an existing scheduled trip except for service start date and time. Used with `TripUpdate.TripProperties.trip_id`, `TripUpdate.TripProperties.start_date`, and `TripUpdate.TripProperties.start_time` to copy an existing trip from static GTFS but start at a different service date and/or time. The trip to be duplicated is identified via TripUpdate.TripDescriptor.trip_id. |
    required:
      - trip_id
    description: The Trip that this message applies to.
  Common_Oas2_GTFS-rt-tripUpdate:
    type: object
    title: GTFS-rt-tripUpdate
    properties:
      trip:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-tripDescriptor'
      stop_time_updates:
        type: array
        items:
          $ref: '#/definitions/Common_Oas2_GTFS-rt-stopTimeUpdate'
      vehicle:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-vehicleDescriptor'
      timestamp:
        type: integer
        description: 'The timestamp of the last vehicle location from the vehicle on this trip as an epoch timestamp (i.e. number of seconds since January 1st 1970 00:00:00 utc)'
      trip_properties:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-TripProperties'
    required:
      - trip
      - stop_time_updates
    description: Realtime update on the progress of a vehicle along a trip.
  Common_Oas2_GTFS-rt-tripUpdatesFeed:
    type: object
    title: GTFS-rt-tripUpdatesFeed
    properties:
      header:
        $ref: '#/definitions/Common_Oas2_GTFS-rt-feedHeader'
      entities:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: Feed-unique identifier for this entity.
            tripUpdate:
              $ref: '#/definitions/Common_Oas2_GTFS-rt-tripUpdate'
  Common_Oas2_GTFS-rt-vehicleDescriptor:
    type: object
    title: GTFS-rt-vehicleDescriptor
    properties:
      id:
        type: string
        description: The unique vehicle id
      label:
        type: string
        description: 'User visible label, i.e., something that must be shown to the passenger to help identify the correct vehicle.'
  Common_Oas2_AgencyKey:
    type: string
    title: agencyKey
    description: The agency key used in the Swiftly dashboard. This is the parameter that follows "dashboard.goswift.ly/" in the Swiftly dashboard url.
  Common_Oas2_Api-route:
    type: string
    title: api-route
    description: The api-route or URL pattern that the user entered.
  Common_Oas2_BlockId-otp:
    type: string
    description: The GTFS `block_id` for this trip. A block consists of a single trip or many sequential trips made using the same vehicle.
    title: blockId
  Common_Oas2_Destination-prediction:
    type: object
    description: There can be multiple trip patterns for a given route and direction. As a traveler you may need to know the buses terminal stop to know if it will serve your stop. There are predictions for each terminal destination that serves this route.
    title: destination-prediction
    properties:
      directionId:
        type: string
        description: The direction of travel that predictions are being made for.
      headsign:
        type: string
        description: The headsign of the vehicle. This represents the terminal stop for this destination
      predictions:
        type: array
        items:
          $ref: '#/definitions/Common_Oas2_Prediction'
    required:
      - directionId
      - headsign
      - predictions
  Common_Oas2_DirectionId-otp:
    type: string
    title: directionId
    description: The direction id for this data ("1" or "0") matching the GTFS `direction_id` for this trip.
  Common_Oas2_Prediction:
    type: object
    description: 'Information on the vehicles predicted departure from a given stop including: departure time, trip id, and vehicle info'
    properties:
      min:
        type: integer
        description: Minutes until the vehicle's predicted departure time. The value will be truncated to zero decimal places.
        example: 1
      sec:
        type: integer
        example: 111
        description: Seconds until the vehicle's predicted departure time
      time:
        type: integer
        example: 1530757424
        description: 'Predicted vehicle departure time as an epoch timestamp (i.e. number of seconds since January 1st 1970 00:00:00 utc)'
      tripId:
        type: string
        description: The trip id corresponding to this predicted arrival or departure.
      vehicleId:
        type: string
        description: The vehicle id corresponding to this predicted arrival or departure.
      departure:
        type: boolean
        description: if field is present and `true` then the prediction is a predicted departure time rather than arrival time. If field is missing or `false` then the prediction is the predicted arrival time.
    required:
      - min
      - sec
      - time
      - tripId
      - vehicleId
  Common_Oas2_Realtime-vehicles:
    type: array
    items:
      type: object
      properties:
        direction:
          type: string
          description: The vehicle direction ("1" or "0") matching the GTFS direction_id for the trip the vehicle is currently serving.
        headsign:
          type: string
          description: The vehicle headsign
        id:
          type: string
          description: The unique vehicle id
        loc:
          type: object
          description: Vehicle location information
          required:
            - lat
            - lon
            - time
          properties:
            heading:
              type: number
              description: 'Vehicle heading, in degrees, clockwise from True North, i.e., 0 is North and 90 is East.'
            lat:
              type: number
              description: Vehicle position - degrees latitude.
            lon:
              type: number
              description: Vehicle position - degrees longitude.
            speed:
              type: number
              description: Vehicle speed measured in meters per second.
            time:
              type: integer
              description: 'Moment at which the vehicle''s position was measured in epoch time (i.e., number of seconds since January 1st 1970 00:00:00 UTC)'
        routeId:
          type: string
          description: 'The route_id from the GTFS of the route that the vehicle is currently serving. '
        routeShortName:
          type: string
          description: 'The route_short_name from GTFS of the route that the vehicle is currently serving. '
        vehicleType:
          type: string
          description: |-
            A code for the vehicle type or route type. It matches the route_type from GTFS. The possible values and associated types are as follows
            | type | Description   |
            |------|---------------|
            | 0    | Tram, Streetcar, Light rail. Any light rail or street level system within a metropolitan area.  |
            | 1    | Subway, Metro. Any underground rail system within a metropolitan area.  |
            | 2    | Rail. Used for intercity or long-distance travel.  |
            | 3    | Bus. Used for short- and long-distance bus routes.  |
            | 4    | Ferry. Used for short- and long-distance boat service.  |
            | 5    | Cable car. Used for street-level cable cars where the cable runs beneath the car.  |
            | 6    | Gondola, Suspended cable car. Typically used for aerial cable cars where the car is suspended from the cable. |
            | 7    | Funicular. Any rail system designed for steep inclines.   |
        block:
          type: string
          description: The block that the vehicle is currently assigned to. This field is only included if `verbose=true`.
        blockAssignmentInfo:
          type: string
          description: A human readable description of how the vehicle was assigned or unassigned. This field is only included if `verbose=true`.
        headwaySecs:
          type: number
          description: The time-spacing (in seconds) between the preceding vehicle and this vehicle. This field is only included if `verbose=true`.
        nextStopId:
          type: string
          description: The stop id of the next stop that the vehicle will be arriving at. This field is only available if `verbose=true`
        nextStopName:
          type: string
          description: The stop name of the next stop that the vehicle will be arriving at. This field is only available if `verbose=true`
        previousVehicleId:
          type: string
          description: The vehicle id of the preceding vehicle on this route. This field is only available if `verbose=true`
        previousVehicleSchAdhSecs:
          type: number
          description: The schedule adherence of the preceding vehicle on this route (in seconds). This field is only available if `verbose=true`
        previousVehicleSchAdhStr:
          type: string
          description: A string formatted version of previousVehicleSchAdhSecs. This field is only available if `verbose=true`
        routeName:
          type: string
          description: The route name (a combination of the route short name and route long name). This field is only included if `verbose=true`. The routeShortName is included even when `verbose=false`.
        schAdhSecs:
          type: number
          description: The vehicle's schedule adherence in seconds. This field is only available if `verbose=true`
        schAdhStr:
          type: string
          description: A string formatted version of schAdhSecs. This field is only available if `verbose=true`
        scheduledHeadwaySecs:
          type: number
          description: The scheduled time-spacing between this vehicle and the preceding vehicle on this route. This field is only available if `verbose=true`
        serviceId:
          type: string
          description: The service id of the trip that the vehicle is currently serving. This matches the `service_id` field in the trips.txt GTFS file. This field is only available if `verbose=true`
        ServiceName:
          type: string
          description: 'The service name of the trip that the vehicle is currently serving. The service name includes the `service_id` field, plus some other information on when this service id is active. This field is only available if `verbose=true`'
        trip:
          type: string
          description: The trip id of the trip that the vehicle is currently serving. This field is only available if `verbose=true`
      required:
        - id
        - loc
        - vehicleType
    title: vehicles
  Common_Oas2_Route:
    type: object
    title: route-info
    properties:
      id:
        type: string
        description: Matches the `route_id` from GTFS. This is an ID that uniquely identifies the route.
      name:
        $ref: '#/definitions/Common_Oas2_Route-name'
      shortName:
        $ref: '#/definitions/Common_Oas2_Route-short-name'
      longName:
        $ref: '#/definitions/Common_Oas2_Route-long-name'
      type:
        $ref: '#/definitions/Common_Oas2_Route-type'
      directions:
        type: array
        description: Contains information about the stops on the route grouped by direction. Only included if `verbose = true`
        items:
          type: object
          properties:
            id:
              type: string
              description: Direction id ("0" or "1") matching GTFS `direction_id`. The id is a binary value that indicates the direction of travel for a trip.
            title:
              type: string
              description: A direction title to associate with the direction. This field usually included the route terminal stop for this direction (i.e. "To Geary + 33rd Avenue").
            stops:
              type: array
              description: A list of stops associated with this route and direction.
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: 'Matches the GTFS `stop_id`. It is an ID that uniquely identifies a stop, station, or station entrance. Multiple routes may use the same stop.'
                  lat:
                    type: number
                    description: 'The latitude of a stop, station, or station entrance.'
                  lon:
                    type: number
                    description: 'The longitude of a stop, station, or station entrance.'
                  name:
                    type: string
                    description: 'Matches the GTFS `stop_name`. This field contains the name of a stop, station, or station entrance.'
                  code:
                    type: integer
                    description: Matches the `stop_code` field from GTFS. It contains short text or a number that uniquely identifies the stop for passengers. Stop codes are often used in phone-based transit information systems or printed on stop signage to make it easier for riders to get a stop schedule or real-time arrival information for a particular stop.
                required:
                  - id
                  - lat
                  - lon
                  - name
                  - code
            headsigns:
              type: array
              description: 'A list of headsigns for trips associated with this route and direction. Trips traveling in the same route and direction may have different terminal stops so one route, direction combination may have multiple headsigns.'
              items:
                type: string
          required:
            - id
            - title
            - stops
            - headsigns
      shapes:
        type: array
        description: The shapes associated with this route (as specified in the GTFS shapes.txt file).
        items:
          type: object
          properties:
            tripPatternId:
              type: string
            shapeId:
              type: string
              description: Matches the GTFS `shape_id`. The field contains an ID that uniquely identifies a shape.
            directionId:
              type: string
              description: Direction id (0 or 1) matching GTFS `direction_id`. This specifies the direction of travel on this particular shape.
            headsign:
              type: string
              description: The headsign (usually terminal stop) for this particular shape.
            locs:
              type: array
              description: 'An array of (lat,lon) coordinates that define the shape (polyline) geometry.'
              items:
                type: object
                properties:
                  lat:
                    type: number
                    description: The latititude of the polyline coordinate.
                  lon:
                    type: number
                    description: The degrees longitude of the polyline coordinate.
          required:
            - tripPatternId
            - shapeId
            - directionId
            - headsign
            - locs
      extent:
        type: object
        description: The minimum and maximum latitude and longitude coordinates of a bounding box that contains the route.
        properties:
          minLat:
            type: number
            description: Minimum latitude of the bounding box that encompasses the route shape.
          minLon:
            type: number
            description: Minimum longitude of the bounding box that encompasses the route shape.
          maxLat:
            type: number
            description: Maximum latitude of the bounding box that encompasses the route shape.
          maxLon:
            type: number
            description: Maximum longitude of the bounding box that encompasses the route shape.
        required:
          - minLat
          - minLon
          - maxLat
          - maxLon
    required:
      - id
      - name
      - shortName
      - longName
      - type
  Common_Oas2_Route-long-name:
    type: string
    title: route-long-name
    description: The `route_long_name` from GTFS. This name is generally more descriptive than the route short name and will often include the route's destination.
  Common_Oas2_Route-name:
    type: string
    title: route-name
    description: A combination of the route short name and long name from GTFS to capture the full route name.
  Common_Oas2_Route-short-name:
    type: string
    title: route-short-name
    description: The `route_short_name` from GTFS. This is often a route number or letter that describes the route (i.e. "5R" or "28").
  Common_Oas2_Route-type:
    type: string
    title: route-type
    description: |-
      The `route_type` from GTFS. The possible values and associated types are as follows
      | route_type | Description   |
      |------------|---------------|
      | 0          | Tram, Streetcar, Light rail. Any light rail or street level system within a metropolitan area. |
      | 1          | Subway, Metro. Any underground rail system within a metropolitan area. |
      | 2          | Rail. Used for intercity or long-distance travel. |
  Common_Oas2_ServiceId-otp:
    type: string
    title: serviceId
    description: The GTFS `service_id` for this trip.  The service id is an ID that uniquely identifies a set of dates when service is available for one or more routes.
  Common_Oas2_Success:
    type: boolean
    description: '`true` if the API call was successful. '
  Common_Oas2_TripId-otp:
    type: string
    description: The trip id. This will match the GTFS `trip_id` field.
    title: tripId
responses:
  400 - Swiftly:
    description: Query submitted with invalid parameters.
    schema:
      $ref: '#/definitions/Common_Oas2_Error%20Swiftly'
    examples:
      application/json:
        errorCode: 400
        errorMessage: Bad request. (Error messages will vary)
  401 - Swiftly:
    description: The request is missing an authorization header.
    schema:
      $ref: '#/definitions/Common_Oas2_Error%20Swiftly'
    examples:
      application/json:
        errorCode: 401
        errorMessage: Missing Authorization Header
  403 - Swiftly:
    description: The included API key does not have access to this module and/or this agency.
    schema:
      $ref: '#/definitions/Common_Oas2_Error%20Swiftly'
    examples:
      application/json:
        errorCode: 403
        errorMessage: Permission Denied
  429 - Swiftly:
    description: The query limits have been exceeded for this API key.
    schema:
      $ref: '#/definitions/Common_Oas2_Error%20Swiftly'
    examples:
      application/json:
        errorCode: 429
        errorMessage: Rate Limited
  503 - Swiftly:
    schema:
      $ref: '#/definitions/Common_Oas2_Error%20Swiftly'
    examples:
      application/json:
        errorCode: 503
        errorMessage: Unexpected Server Error
    description: Unexpected error.
