      summary: Agency routes
      description: |-
        Fetches information about an agency's routes. The data originates from an agency's raw data as specified in their GTFS files. Where appropriate, Swiftly adds normalization and supplementary information. 

        By default this endpoint will provide a list with information on all routes in the system. To access information on one route or a subset of the routes, provide the `route` query parameter with the list of routes you want data for. To get more detailed information on the routes including the route shape information and the stops associated with the route, include the query parameter `verbose=true`. A detailed schema and example data are provided below.
