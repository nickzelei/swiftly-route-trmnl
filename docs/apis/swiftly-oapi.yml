      summary: Predictions near location
      description: |-
        Fetches real-time predictions near a specific latitude and longitude.

        The `lat` and `lon` are required query parameters signifying the latitude and longitude to search around. Predictions will be generated for all stops within a specified distance of the query location. The distance is specified by the `meters` query parameter and will default to 1500 meters if the `meters` parameter is missing.

        The `number` designates the number of future predictions to return per route/stop in the response. If not provided defaults to 3. If fewer than `number` predictions are returned in the response, this means that there are fewer than `number` future predictions available for that route and stop combination at this time.
      tags:
        - Real-time
      parameters:
        - in: query
          name: lat
          type: number
          required: true
          description: The latitude to search around
        - in: query
          name: lon
          type: number
          required: true
          description: The longitude to search around
        - in: query
          name: number
          type: integer
          description: 'The number of future predictions to return per route/stop in the response. If not provided defaults to 3. If fewer than `number` prediction are returned in the response, this means that there are fewer than `number` future predictions available for that route and stop.'
        - in: query
          name: meters
          type: integer
          description: 'The radius around the `lat`, `lon` coordinate to search for stops to generate predictions for. Defaults to 1500 meters if this parameter is omitted.'
        - in: header
          name: Accept
          type: string
          description: Set to `application/xml` for XML format or `application/json` for JSON (default).
      produces:
        - application/json
        - application/xml
