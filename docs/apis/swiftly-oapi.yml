        - in: query
          name: number
          type: integer
          default: 3
          description: 'The number of future predictions to return per route/stop in the response. If not provided defaults to 3. If fewer than `number` prediction are returned in the response, this means that there are fewer than `number` future predictions available for that route and stop.'
        - in: header
