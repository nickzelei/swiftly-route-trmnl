      summary: Predictions
      tags:
        - Real-time
      security:
        - Authorization: []
      description: |-
        Fetches real-time arrival predictions for a given stop id or stop code designated by the `stop` required query parameter.

        If `stop` refers to a stop id - the stop id must match the GTFS `stop_id`, a unique identifier of a stop, station, or station entrance.  If `stop` refers to a stop code the stop code must match the `stop_code` field from GTFS. The stop code is an optional field in GTFS and is generally some short text or a number that uniquely identifies the stop for passengers. Stop codes are often used in phone-based transit information systems or printed on stop signage to make it easier for riders to get a stop schedule or real-time arrival information for a particular stop. Note that multiple routes may use the same stop.

        The `route` is an optional query parameter. If the route is specified, then the results will only include predictions for that stop on the specified route. Otherwise the returned predictions data will include all routes that contain the stop.

        The `number` designates the number of future predictions to return per route/stop in the response, defaulting to 3 predictions if not provided. If fewer than `number` predictions are returned in the response, this means that there are fewer than `number` future predictions available for that route and stop combination at this time.
      produces:
        - application/xml
        - application/json
