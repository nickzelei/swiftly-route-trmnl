      summary: Active blocks
      description: |-
        Fetches all blocks currently active for an agency, in real-time. Each block in the response includes its associated static schedule information (service ID, start time and end time) as well as the currently active trip, current schedule adherence, and vehicle information.

        A block is a series of consecutive trips served by a single vehicle. While a block is active, its vehicle is either on a scheduled trip, or going from the end location of one trip to the start location of its next trip. Between trips, a vehicle does not pick up passengers (also known as non-revenue or dead heading).
      tags:
        - Real-time
        - Internal
      security:
        - Authorization: []
      parameters:
        - $ref: '#/parameters/agencyKey'
      produces:
        - application/json
