        - in: query
          name: format
          type: string
          enum:
            - json
            - human
          description: 'The default response format is the Google Protocol Buffer binary format.  For human-readable formats, the `json` and `human` options are available.'
        - in: query
          name: version
          type: string
          default: '2.0'
          enum:
            - 2
            - '2.0'
            - 3
            - '3.0'
          description: 'Do not use this param.  This param is deprecated and will be removed.  Instead, use `enable-feature`.'
          x-deprecated: true
        - in: query
          name: enable-feature
          type: string
          enum:
            - deleted-trips
            - duplicated-trips
            - new-shapes
          description: |
            Certain new, experimental, or optional features of the GTFS-realtime specification may be supported by this API endpoint.
            Consumers may choose to enable those features when calling this endpoint.
            To enable multiple features, this param can be specified multiple times with different values.

            `deleted-trips` enables the `DELETED` TripUpdate ScheduleRelationship.  
            When this feature is enabled, certain canceled trips may be marked as `DELETED` to indicate those trips should be omitted from realtime displays rather than displayed as canceled.  
            When this feature is not enabled, the trips that would be DELETED are instead marked as CANCELED.

            `duplicated-trips` enables the `DUPLICATED` TripUpdate ScheduleRelationship.  
            When this feature is enabled, all added trips will be marked as `DUPLICATED` to indicate those trips are based on a scheduled service and not an entirely new service.  
            When this feature is not enabled, added trips are marked as `ADDED`.

            `new-shapes` enables the additional FeedEntity `Shape`, which conveys details about realtime added shapes.

            For full details, consult the GTFS-realtime specification.
      summary: GTFS-rt-trip-updates
      description: |
        The GTFS-realtime calls are designed for server-to-server communication. The trip updates GTFS-realtime data provides predictions for all vehicles, all stops and all routes in the system. Since the GTFS-realtime calls provide data for the entire agency, the returned data can be quite large and not appropriate for individual client requests. **For this reason, requests to GTFS-rt APIs from web browsers are not supported.**

        Typically, after customers make a GTFS-realtime call, the customer will store the results on a local server and these stored results are used to serve the passenger-facing tools.
        These endpoints are meant to be called about every 10-30 seconds. No ‘Access-Control-Allow-Origin’ header is present for this endpoint, since it is not intended to be used by individual clients.

        The default response format is is Google Protocol Buffer format.  Other formats may be available by specifying the `format` query param; for more details, see the Query Params section.

        If a customer is creating a client web-application and does not want to store results on their own servers, some of our other endpoints are better suited since they can provide limited information targeted to a specific route or stop. The predictions endpoints can be used to get vehicle arrival times for a particular route/stop or location.

        The full GTFS-realtime specification is outlined here: [https://developers.google.com/transit/gtfs-realtime/](https://developers.google.com/transit/gtfs-realtime/). The spec is flexible in that several fields are optional or conditionally required. The tables below will outline the fields that Swiftly provides in our version of the GTFS-realtime trip-updates feed. We also provide a GTFS-realtime vehicle-positions example feed.
    parameters:
      - $ref: '#/parameters/agencyKey'
