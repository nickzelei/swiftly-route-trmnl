      summary: Vehicles
      security:
        - Authorization: []
      parameters:
        - $ref: '#/parameters/route'
        - in: query
          name: unassigned
          type: string
          description: 'If true, includes unassigned vehicles as well as assigned vehicles. By default will only include vehicles that are assigned to a route.'
        - in: query
          name: verbose
          type: string
          description: 'If present, include additional information. '
        - in: header
          name: Accept
          type: string
          description: Set to `application/xml` for XML format or `application/json` for JSON (default).
      tags:
        - Real-time
      description: |-
        Fetches real-time information about an agency's vehicles and last-reported locations. If a vehicle is actively serving a route, the route and direction information will also be provided. 

        To get more detailed information about a vehicle, including block assignment, trip assignment, schedule adherence, and current headway, submit the query with query parameter `verbose=true`. A detailed schema and example data are provided below.
      produces:
        - application/json
        - application/xml
  '/real-time/{agencyKey}/predictions-near-location':
    parameters:
      - $ref: '#/parameters/agencyKey'
    get:
      responses:
        '200':
          description: Success.
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  agencyKey:
                    $ref: '#/definitions/Common_Oas2_AgencyKey'
                  predictionsData:
                    type: array
                    items:
                      type: object
                      properties:
                        destinations:
                          type: array
                          items:
                            $ref: '#/definitions/Common_Oas2_Destination-prediction'
                        distanceToStop:
                          type: number
                          description: 'The distance from the query location to the stop in meters. '
                        routeId:
                          type: string
                          description: The route id that these predictions are for. Matches the `route_id` from GTFS. This is an ID that uniquely identifies the route.
                        routeName:
                          type: string
                          description: The route name that these predictions are for. The route name is a combination of the route short name and long name.
                        routeShortName:
                          type: string
                          description: The `route_short_name` from GTFS. This is often a route number or letter that describes the route (i.e. "5R" or "28").
                        stopCode:
                          type: integer
                          description: The stop code that predictions are for. This field matches the `stop_code` field from GTFS. It contains short text or a number that uniquely identifies the stop for passengers. Stop codes are often used in phone-based transit information systems or printed on stop signage to make it easier for riders to get a stop schedule or real-time arrival information for a particular stop.
                        stopId:
                          type: string
                          description: 'The stop id that predictions are for. This field matches the GTFS `stop_id`. It is an ID that uniquely identifies a stop, station, or station entrance. Multiple routes may use the same stop.'
                        stopName:
                          type: string
                          description: 'The name of the stop that predictions are for. This field matches GTFS `stop_name` and contains the name of a stop, station, or station entrance.'
              route:
                $ref: '#/definitions/Common_Oas2_Api-route'
              success:
                $ref: '#/definitions/Common_Oas2_Success'
