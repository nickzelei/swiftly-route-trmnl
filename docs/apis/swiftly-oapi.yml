    get:
      responses:
        '200':
          description: 'Below find an example of our trip updates GTFS-realtime feed, and detailed information on the fields that are returned. As mentioned in the description, results are typically returned in the Google Protocol Buffer binary format, as the GTFS-rt is designed for server-to-server communication. However, with the query parameter format=''human'', we can produce an ASCII human-readable version.'
          schema:
