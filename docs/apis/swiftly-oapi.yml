swagger: '2.0'
info:
  title: Swiftly API Reference
  version: '1.0'
  description: |
    This guide is designed to provide you with everything you need to familiarize yourself with Swiftly’s real-time transit data, and if authorized, to access the data via API.

    ### API Overview

    Swiftly Transitime APIs provide real-time vehicle location information in GTFS-rt, JSON, XML, or SIRI formats.

    Transit agencies and operators that purchase Swiftly Transtime can provide their real-time transit data to 3rd parties for the purpose of developing applications, websites, and other interfaces to surface real-time transit information.

    Swiftly welcomes extending and creating a broad ecosystem of applications using our real-time transit data. All Swiftly API use must be compliant with [Swiftly's Terms of Service](https://www.goswift.ly/saas-terms-of-service) and [API License Agreement](https://www.goswift.ly/api-license/).

    ### Authorization

    Before we dive into the specifics of the Swiftly API endpoints, let’s talk about authorization. All requests to the Swiftly API must be authorized. Authorization is accomplished by including an HTTP header named “Authorization.” The value of this header field must contain a valid API key.

    You can view your API Key in the API Guide when logged into your Swiftly account. If you do not yet have access to a Swiftly account to view API information, you can request one by submitting an application via [this form](http://goswift.ly/realtime-api-key).
paths:
  /test-key:
    get:
      responses:
        '200':
          description: Success.
          schema:
            type: object
            properties:
              route:
                $ref: '#/definitions/Common_Oas2_Api-route'
              success:
                $ref: '#/definitions/Common_Oas2_Success'
            required:
              - route
              - success
          examples:
            application/json:
              route: /test-key GET
              success: true
        '401':
          $ref: '#/responses/401%20-%20Swiftly'
        '403':
          $ref: '#/responses/403%20-%20Swiftly'
      security:
        - Authorization: []
      summary: Test Key
      tags:
        - Test Key
      produces:
        - application/json
      description: 'Test whether your API key is working! Run the test-key API call using your Swiftly issued API key to confirm that you are getting valid results. The results will have success=true if the test was successful. '
  '/info/{agencyKey}':
    get:
      responses:
        '200':
          description: Success.
          schema:
            type: object
            properties:
              data:
                type: object
                required:
                  - agencyKey
                  - extent
                  - name
                  - timezone
                  - url
                properties:
                  agencyKey:
                    $ref: '#/definitions/Common_Oas2_AgencyKey'
                  extent:
                    type: object
                    description: The minimum and maximum latitude and longitude coordinates of a bounding box that contains all routes the agency serves.
                    required:
                      - maxLat
                      - maxLon
                      - minLat
                      - minLon
                    properties:
                      maxLat:
                        type: number
                        description: Maximum latitude of the bounding box that contains all routes in the agency
                      maxLon:
                        type: number
                        description: Maximum longitude of the bounding box that contains all routes in the agency
                      minLat:
                        type: number
                        description: Minimum latitude of the bounding box that contains all routes in the agency
                      minLon:
                        type: number
                        description: Minimum longitude of the bounding box that contains all routes in the agency
                  name:
                    type: string
                    description: The agency name. This matches the `agency_name` field in the agency.txt GTFS file.
                  timezone:
                    type: string
                    description: The agency timezone. This matches the `agency_timezone` field in the agency.txt GTFS file.
                  url:
                    type: string
                    description: The agency URL. This matches the `agency_url` field in the agency.txt GTFS file.
              route:
                $ref: '#/definitions/Common_Oas2_Api-route'
              success:
                $ref: '#/definitions/Common_Oas2_Success'
            required:
              - data
              - route
              - success
          examples:
            application/json:
              data:
                agencyKey: sfmta
                extent:
                  maxLat: 37.83644
                  maxLon: -122.36633
                  minLat: 37.70576
                  minLon: -122.53867
                name: San Francisco MTA
                timezone: America/Los_Angeles
                url: 'http://www.sfmta.com'
              route: /info/sfmta GET
              success: true
